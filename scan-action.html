<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Status Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px 20px; background-color: #f4f6f9; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #333; margin-bottom: 25px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-in { background-color: #28a745; }
        .btn-in:hover { background-color: #218838; }
        .btn-out { background-color: #dc3545; }
        .btn-out:hover { background-color: #c82333; }
        .btn-sub { background-color: #6c757d; }
        .btn-sub:hover { background-color: #5a6268; }
        .btn-next { background-color: #007bff; }
        .btn-next:hover { background-color: #0056b3; }
        .btn-next:disabled { background-color: #9abce3; cursor: not-allowed; }
        input[type="text"], textarea { width: 100%; padding: 12px; margin: 10px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        .hidden { display: none !important; }
        .error { color: #dc3545; font-size: 14px; margin-bottom: 15px; text-align: left; font-weight: bold; }
        
        /* Popup Modal Styles */
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 80%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; }
        .modal-content h3 { margin-top: 0; font-size: 22px; }
        .modal-content p { color: #627d98; margin-bottom: 20px; line-height: 1.5; }
        .flex-buttons { display: flex; gap: 10px; }
        .flex-buttons .btn { margin: 0; }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- Step 1: Enter Patient ID -->
        <div id="patient-id-screen">
            <h2>Enter Patient ID</h2>
            <input type="text" id="patient-id-input" placeholder="e.g., 123456" onkeydown="if(event.key === 'Enter') proceedToStatus()">
            <div id="id-error" class="error hidden">Case Not Found!</div>
            <button id="continue-btn" class="btn btn-next" onclick="proceedToStatus()">Verify ID</button>
        </div>

        <!-- Step 2: Select Status -->
        <div id="status-screen" class="hidden">
            <h2>Select Status</h2>
            <p id="display-patient-id" style="color: #627d98; margin-top: -15px; margin-bottom: 20px; font-weight: bold;"></p>
            
            <!-- Main Actions -->
            <div id="main-actions">
                <button class="btn btn-in" onclick="handleAction('In Progress')">Patient In</button>
                <button class="btn btn-out" onclick="showOutOptions()">Patient Out</button>
            </div>

            <!-- Sub-Actions for Patient Out -->
            <div id="out-actions" class="hidden">
                <button class="btn btn-in" onclick="handleAction('Finished')">Finished</button>
                <button class="btn btn-out" onclick="handleAction('Cancelled')">Cancelled</button>
                <button class="btn btn-sub" onclick="resetView()">Back</button>
            </div>
        </div>

    </div>

    <!-- Cancel Reason Popup Modal -->
    <div id="cancel-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 style="color: #dc3545;">Cancel Case</h3>
            <p>Please provide a reason for cancellation:</p>
            <textarea id="cancel-reason-input" rows="3" placeholder="Enter reason here..."></textarea>
            <div class="flex-buttons">
                <button class="btn btn-sub" onclick="closeCancelModal()">Back</button>
                <button class="btn btn-out" onclick="submitCancellation()">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Success Popup Modal -->
    <div id="success-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <h3 style="color: #28a745;">Successful!</h3>
            <p>The patient status has been updated in the database.</p>
            <button class="btn btn-next" onclick="closeSuccessModal()">OK</button>
        </div>
    </div>

    <!-- Import Firebase Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOaeCpwoW4IWZscRr_5IuOlf2m_QwH7PM",
            authDomain: "bprh-operating-room-schedule.firebaseapp.com",
            projectId: "bprh-operating-room-schedule",
            storageBucket: "bprh-operating-room-schedule.firebasestorage.app",
            messagingSenderId: "306336649650",
            appId: "1:306336649650:web:42dc025e5376a7604114ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.currentPatientId = "";
        window.currentDocId = ""; 
        window.currentPatientData = null; 

        window.proceedToStatus = async function() {
            const inputVal = document.getElementById('patient-id-input').value.trim();
            const errorMsg = document.getElementById('id-error');
            const btn = document.getElementById('continue-btn');

            if (inputVal === "") {
                errorMsg.textContent = "Please enter a valid Patient ID.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.textContent = "Verifying...";
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const casesRef = collection(db, "cases");
                const q = query(casesRef, where("patient_id", "==", inputVal));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    errorMsg.textContent = "Case Not Found!";
                    errorMsg.classList.remove('hidden');
                } else {
                    const patientDoc = querySnapshot.docs[0];
                    const patientData = patientDoc.data();
                    const currentStatus = patientData.status || "";

                    if (currentStatus === "Cancelled") {
                        errorMsg.textContent = "This case was cancelled!";
                        errorMsg.classList.remove('hidden');
                    } else if (currentStatus === "Finished") {
                        errorMsg.textContent = "Case Finished";
                        errorMsg.classList.remove('hidden');
                    } else {
                        window.currentPatientId = inputVal;
                        window.currentDocId = patientDoc.id; 
                        window.currentPatientData = patientData; 
                        
                        const patientName = patientData.patient_name || inputVal;

                        document.getElementById('patient-id-screen').classList.add('hidden');
                        document.getElementById('status-screen').classList.remove('hidden');
                        document.getElementById('display-patient-id').textContent = `Patient: ${patientName} (${inputVal})`;
                        document.getElementById('display-patient-id').style.color = "#627d98"; 
                    }
                }
            } catch (error) {
                console.error("Error verifying ID:", error);
                errorMsg.textContent = "Error: " + error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.textContent = "Verify ID";
                btn.disabled = false;
            }
        };

        window.showOutOptions = function() {
            document.getElementById('main-actions').classList.add('hidden');
            document.getElementById('out-actions').classList.remove('hidden');
        };

        window.resetView = function() {
            document.getElementById('out-actions').classList.add('hidden');
            document.getElementById('main-actions').classList.remove('hidden');
        };

        window.handleAction = function(status) {
            if (status === 'Cancelled') {
                // Show the cancel reason popup instead of updating immediately
                document.getElementById('cancel-modal').classList.remove('hidden');
                document.getElementById('cancel-reason-input').value = "";
                document.getElementById('cancel-reason-input').focus();
            } else {
                // If it's In Progress or Finished, update normally without a remark
                executeUpdate(status, "");
            }
        };

        // Handles closing the Cancel modal if they change their mind
        window.closeCancelModal = function() {
            document.getElementById('cancel-modal').classList.add('hidden');
        };

        // Handles submitting the Cancel reason
        window.submitCancellation = function() {
            const reason = document.getElementById('cancel-reason-input').value.trim();
            if (reason === "") {
                alert("Please provide a reason for cancellation.");
                return;
            }
            
            document.getElementById('cancel-modal').classList.add('hidden');
            
            // Append the reason to any existing remark so we don't delete old notes
            const existingRemark = window.currentPatientData.remark || "";
            const formattedRemark = existingRemark ? existingRemark + " | Cancelled: " + reason : "Cancelled: " + reason;
            
            executeUpdate('Cancelled', formattedRemark);
        };

        // The core updating function shared by all statuses
        window.executeUpdate = async function(status, newRemark) {
            const statusBtns = document.querySelectorAll('#status-screen .btn');
            statusBtns.forEach(btn => btn.disabled = true);
            
            const displayEl = document.getElementById('display-patient-id');
            displayEl.textContent = "Updating database... Please wait.";
            displayEl.style.color = "#007bff";

            try {
                const caseRef = doc(db, "cases", window.currentDocId);
                const updatedTime = new Date().toISOString();
                
                // Prepare the data payload
                let updatePayload = { 
                    status: status,
                    updated_at: updatedTime
                };
                
                // Add the remark to the payload if a new one was provided
                if (newRemark !== "") {
                    updatePayload.remark = newRemark;
                }
                
                // 1. Update Firebase directly
                await updateDoc(caseRef, updatePayload);

                // 2. Sync change to Google Sheets quietly in the background
                const scriptURL = 'https://script.google.com/macros/s/AKfycbwrk6OuH81kLg4H0CA8j2mXxvYk3C1Ag-nLO09VUvM0BteaU5spvNRDtzTpDtXYkzo/exec';
                const sheetsPayload = { 
                    ...window.currentPatientData, 
                    ...updatePayload, 
                    __backendId: window.currentDocId 
                };
                
                fetch(scriptURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(sheetsPayload)
                }).catch(e => console.error("Sheets sync issue:", e));

                // 3. Show Success Popup
                displayEl.textContent = "Update complete.";
                displayEl.style.color = "#28a745"; 
                
                document.querySelector('#success-modal .btn').disabled = false;
                document.getElementById('success-modal').classList.remove('hidden');

            } catch (error) {
                console.error("Error updating status:", error);
                
                displayEl.textContent = "Failed: " + error.message;
                displayEl.style.color = "#dc3545"; 
                
                statusBtns.forEach(btn => btn.disabled = false);
            }
        };

        window.closeSuccessModal = function() {
            document.getElementById('success-modal').classList.add('hidden');
            window.location.reload(); // Reloads the page to start completely fresh
        };
    </script>
</body>
</html>
